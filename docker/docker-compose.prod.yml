version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lucknow_events}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the selected env file}
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine

  api:
    build: ../backend
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    env_file: ../.env.prod
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.prod}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Set ADMIN_PASSWORD_HASH in .env.prod}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.prod}
      DEBUG: "false"
    depends_on: [postgres, redis]
    restart: unless-stopped

  worker:
    build: ../backend
    command: celery -A workers.celery_app worker --loglevel=info -c 4 -Q default
    env_file: ../.env.prod
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.prod}
      DEBUG: "false"
    depends_on: [postgres, redis]
    restart: unless-stopped

  beat:
    build: ../backend
    command: celery -A workers.celery_app beat --loglevel=info
    env_file: ../.env.prod
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.prod}
      DEBUG: "false"
    depends_on: [redis, postgres]
    restart: unless-stopped

  flower:
    build: ../backend
    command: celery -A workers.celery_app flower --port=5555
    env_file: ../.env.prod
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.prod}
      DEBUG: "false"
    depends_on: [redis]
    restart: unless-stopped

volumes:
  pgdata:

